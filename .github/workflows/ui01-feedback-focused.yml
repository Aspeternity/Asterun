name: UI-01 Feedback Focused (temporary)

on:
  push:
    branches:
      - fix/ui01-interaction-paint-integrity

permissions:
  contents: read

jobs:
  focused-feedback:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused runtime test
        shell: pwsh
        run: cmake -S . -B build-ui01-feedback -A x64 -DBUILD_TESTING=ON
      - name: Build feedback_runtime_tests only
        shell: pwsh
        run: cmake --build build-ui01-feedback --config Release --target feedback_runtime_tests --parallel
      - name: Execute feedback_runtime_tests only
        shell: pwsh
        run: ctest --test-dir build-ui01-feedback -C Release -R "^feedback_runtime_tests$" --output-on-failure --timeout 12

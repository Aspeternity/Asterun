name: Acceptance kit validation (batch A, not for merge)

# Runs the external batch A acceptance kit (acceptance-kit/) on a Windows
# runner against a package built from this commit, exactly as the checklist
# runs it, and records the results as annotations. This branch and workflow
# exist only to validate the kit; they are not part of the product and are
# not to be merged. Nothing here changes the product package.

on:
  push:
    branches: ['acceptance/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    name: Kit on Windows x64
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      HOST: C:\AsterunAcceptance
    steps:
      - uses: actions/checkout@v4

      - name: Build candidate package (same steps as build.yml)
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/Asterun.exe, build/Release/Update.exe, build/Release/Uninstall.exe dist/
          Copy-Item -Recurse build/Release/dict dist/dict
          Copy-Item -Recurse build/Release/third_party dist/third_party
          Copy-Item VERSION dist/VERSION
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath Asterun-x64.zip
          python scripts/verify_pe_contract.py --directory dist --arch x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 0 Uninstall launcher -> worker flow (product CTest script, full output)
        continue-on-error: true
        shell: pwsh
        run: |
          # Same script as the PR's uninstall_launcher_flow CTest, run against the
          # Release build so its full output is visible as an annotation.
          $ps = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $log = "$env:RUNNER_TEMP\uninstall-launcher-flow.txt"
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\UninstallLauncherFlowTests.ps1 -AppDir build\Release *> $log
          $code = $LASTEXITCODE
          & .github/kit-validation/Write-Notice.ps1 -Title "Uninstall launcher flow (exit $code)" -File $log
          exit $code

      - name: Lay out the host folders as the sandbox maps them
        shell: pwsh
        run: |
          foreach ($d in 'packages', 'kit', 'tools', 'logs') { New-Item -ItemType Directory -Force -Path "$env:HOST\$d" | Out-Null }
          Copy-Item Asterun-x64.zip "$env:HOST\packages\Asterun-x64-candidate.zip"
          Invoke-WebRequest https://github.com/Aspeternity/Asterun/releases/download/v1.0.5/Asterun-x64.zip -OutFile "$env:HOST\packages\Asterun-x64-v1.0.5.zip"
          Invoke-WebRequest https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile "$env:HOST\tools\ProcessMonitor.zip"
          Copy-Item -Recurse acceptance-kit\* "$env:HOST\kit"
          $lines = foreach ($f in Get-ChildItem -Recurse -File "$env:HOST\packages", "$env:HOST\tools", "$env:HOST\kit") {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower(), $f.FullName.Substring($env:HOST.Length + 1)
          }
          $lines | Set-Content "$env:HOST\logs\inputs.sha256"
          $lines | Select-Object -First 40 | ForEach-Object { Write-Host $_ }
          $c = (Get-FileHash -Algorithm SHA256 Asterun-x64.zip).Hash.ToLower()
          & .github/kit-validation/Write-Notice.ps1 -Title 'Kit inputs' -Lines (@("candidate Asterun-x64.zip sha256=$c", 'commit=${{ github.sha }}') + @($lines | Where-Object { $_ -match '^\w+  (packages|tools)' }))

      - name: Build the probe with MSVC as well
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          mkdir %HOST%\probe-msvc
          cd /d %HOST%\probe-msvc
          cl /nologo /O1 /GS- /LD "%HOST%\kit\probe-dll\asterun_dll_probe.c" /link /NODEFAULTLIB /ENTRY:DllMain kernel32.lib /OUT:asterun_dll_probe.dll || exit /b 1
          dumpbin /nologo /imports /exports asterun_dll_probe.dll

      - name: Make packages, kit and tools read-only (as the sandbox maps them)
        shell: pwsh
        run: |
          foreach ($d in 'packages', 'kit', 'tools') {
            # Specific rights only: the simple rights W and D include SYNCHRONIZE, and denying
            # that blocks ordinary reads.
            icacls "$env:HOST\$d" /deny '*S-1-1-0:(OI)(CI)(WD,AD,WEA,WA,DE,DC)' | Out-Null
            if (-not (Get-Content "$env:HOST\kit\README.md" -TotalCount 1)) { throw 'read blocked' }
            try { Set-Content "$env:HOST\$d\write-test.txt" x -ErrorAction Stop; throw "$d is writable" } catch [System.UnauthorizedAccessException] { Write-Host "$d read-only: ok" }
          }

      - name: 1 Check-Environment (runner has the VC++ runtime, expect NOT clean)
        if: always()
        shell: pwsh
        run: |
          & .github/kit-validation/Invoke-Logged.ps1 -Title 'Check-Environment' -Log "$env:HOST\logs\step1-environment.console.txt" -Script "$env:HOST\kit\scripts\Check-Environment.ps1" -Arguments @('-Log', "$env:HOST\logs\environment.txt")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ((Get-Content -Raw "$env:HOST\logs\environment.txt") -match 'NOT clean')) { Write-Host 'DEVIATION: expected NOT clean on the runner'; exit 1 }

      - name: 2 Initialize-Workspace (new folder; second run with the same name must stop)
        if: always()
        shell: pwsh
        run: |
          $a = @('-BaselineZip', "$env:HOST\packages\Asterun-x64-v1.0.5.zip", '-CandidateZip', "$env:HOST\packages\Asterun-x64-candidate.zip",
            '-Tools', "$env:HOST\tools", '-Kit', "$env:HOST\kit", '-Logs', "$env:HOST\logs", '-RunName', 'ci-run')
          & .github/kit-validation/Invoke-Logged.ps1 -Title 'Initialize-Workspace first run' -Log "$env:HOST\logs\step2a.console.txt" -Script "$env:HOST\kit\scripts\Initialize-Workspace.ps1" -Arguments $a
          $first = $LASTEXITCODE
          if ($first) { exit 1 }
          $snapshot = { Get-ChildItem -Recurse -File C:\AsterunWork\ci-run, "$env:HOST\logs\ci-run" | ForEach-Object { "$($_.FullName) $($_.Length) $($_.LastWriteTimeUtc.Ticks)" } }
          $before = & $snapshot
          & .github/kit-validation/Invoke-Logged.ps1 -Title 'Initialize-Workspace repeated with the same run name (expect exit 2)' -Log "$env:HOST\logs\step2b.console.txt" -Script "$env:HOST\kit\scripts\Initialize-Workspace.ps1" -Arguments $a
          $second = $LASTEXITCODE
          $after = & $snapshot
          $unchanged = -not (Compare-Object $before $after)
          Write-Host "second run exit=$second unchanged=$unchanged"
          & .github/kit-validation/Write-Notice.ps1 -Title 'Initialize-Workspace repeat check' -Lines @("repeated run exit $second (expected 2); workspace and log folder unchanged=$unchanged")
          if ($second -ne 2 -or -not $unchanged) { exit 1 }
          exit 0

      - name: 3 Analyzer self-test on synthetic captures
        if: always()
        shell: pwsh
        run: |
          & .github/kit-validation/Invoke-Logged.ps1 -Title 'Analyzer self-test (Windows PowerShell 5.1)' -Log "$env:HOST\logs\step3.console.txt" -Script "$env:HOST\kit\tests\Test-Analyzer.ps1" -Arguments @('-Out', "$env:HOST\logs\analyzer-selftest")
          exit $LASTEXITCODE

      - name: 4 Probe self-test (LLVM build from the kit and MSVC build)
        if: always()
        shell: pwsh
        run: |
          $fail = 0
          foreach ($pair in @(@('llvm', "$env:HOST\kit\probe-dll\out\x64\asterun_dll_probe.dll"), @('msvc', "$env:HOST\probe-msvc\asterun_dll_probe.dll"))) {
            $hash = (Get-FileHash -Algorithm SHA256 $pair[1]).Hash.ToLower()
            & .github/kit-validation/Invoke-Logged.ps1 -Title "Probe self-test $($pair[0]) sha256=$hash" -Log "$env:HOST\logs\step4-$($pair[0]).console.txt" -Script "$env:HOST\kit\probe-dll\Test-Probe.ps1" -Arguments @('-Dll', $pair[1])
            if ($LASTEXITCODE) { $fail++ }
          }
          $bytes = [System.IO.File]::ReadAllBytes("$env:PUBLIC\AsterunDllProbe\probe-log.txt")
          $bom = $bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE
          & .github/kit-validation/Write-Notice.ps1 -Title 'Probe log encoding' -Lines @("UTF-16LE BOM present: $bom")
          if (-not $bom) { $fail++ }
          exit $fail

      - name: 5 Run-Acceptance (controls on v1.0.5, then the candidate scenarios)
        if: always()
        id: run
        shell: pwsh
        run: |
          & .github/kit-validation/Invoke-Logged.ps1 -Title 'Run-Acceptance' -Log "$env:HOST\logs\step5.console.txt" -Script "$env:HOST\kit\scripts\Run-Acceptance.ps1" -Arguments @('-Work', 'C:\AsterunWork\ci-run', '-Logs', "$env:HOST\logs")
          "code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: 6a Scenario reports (condensed)
        if: always()
        shell: pwsh
        run: |
          $dir = "$env:HOST\logs\ci-run"
          foreach ($console in Get-ChildItem $dir -Filter '*.console.txt' | Where-Object { $_.Name -notlike 'investigate-*' } | Sort-Object Name) {
            $name = $console.Name -replace '\.console\.txt$', ''
            $match = Select-String -LiteralPath $console.FullName -Pattern '^REPORT=(.+)$' | Select-Object -Last 1
            $report = @(if ($match -and (Test-Path -LiteralPath $match.Matches[0].Groups[1].Value)) { Get-Item -LiteralPath $match.Matches[0].Groups[1].Value })
            if ($report.Count -eq 1) {
              $keep = Get-Content $report[0].FullName | Where-Object {
                $_ -match '^(scenario|appDir|rows|processes|  \w+\.exe pid|planted names|probe log|  probe:|TARGET|  pid=|    LOADED|      |    plant|    no plant|    verified|    pid verdict|  verdict|    INFO|    INVALID|CONTROL-VALID|RESULT|functional|\(|  \|)' }
              & .github/kit-validation/Write-Notice.ps1 -Title $report[0].BaseName -Lines ($keep | Where-Object { $_ -notmatch '^      \(file-op\)' -or $_ -match 'NOT FOUND' } | ForEach-Object { if ($_.Length -gt 260) { $_.Substring(0, 260) + '...' } else { $_ } } | Select-Object -First 70)
            } else {
              & .github/kit-validation/Write-Notice.ps1 -Title "$name (no report; console output)" -Lines (Get-Content $console.FullName | ForEach-Object { if ($_.Length -gt 240) { $_.Substring(0, 240) + '...' } else { $_ } } | Select-Object -Last 60)
            }
          }

      - name: 6b Investigation reports (condensed)
        if: always()
        shell: pwsh
        run: |
          $dir = "$env:HOST\logs\ci-run"
          foreach ($console in Get-ChildItem $dir -Filter '*.console.txt' | Where-Object { $_.Name -like 'investigate-*' } | Sort-Object Name) {
            $name = $console.Name -replace '\.console\.txt$', ''
            $match = Select-String -LiteralPath $console.FullName -Pattern '^REPORT=(.+)$' | Select-Object -Last 1
            $report = @(if ($match -and (Test-Path -LiteralPath $match.Matches[0].Groups[1].Value)) { Get-Item -LiteralPath $match.Matches[0].Groups[1].Value })
            if ($report.Count -eq 1) {
              $keep = Get-Content $report[0].FullName | Where-Object {
                $_ -match '^(scenario|appDir|rows|processes|  \w+\.exe pid|planted names|probe log|  probe:|TARGET|  pid=|    LOADED|      |    plant|    no plant|    verified|    pid verdict|  verdict|    INFO|    INVALID|CONTROL-VALID|RESULT|functional|\(|  \|)' }
              & .github/kit-validation/Write-Notice.ps1 -Title $report[0].BaseName -Lines ($keep | Where-Object { $_ -notmatch '^      \(file-op\)' -or $_ -match 'NOT FOUND' } | ForEach-Object { if ($_.Length -gt 260) { $_.Substring(0, 260) + '...' } else { $_ } } | Select-Object -First 70)
            } else {
              & .github/kit-validation/Write-Notice.ps1 -Title "$name (no report; console output)" -Lines (Get-Content $console.FullName | ForEach-Object { if ($_.Length -gt 240) { $_.Substring(0, 240) + '...' } else { $_ } } | Select-Object -Last 60)
            }
          }

      - name: 6c Investigation - which loaded system DLLs import ncrypt.dll / ntasn1.dll
        if: always()
        shell: pwsh
        run: |
          $out = @()
          foreach ($pair in @(@('candidate-uninstall-launcher-2*.csv', 'Uninstall.exe'), @('candidate-uninstall-worker-2*.csv', 'Uninstall.exe'), @('candidate-main-2*.csv', 'Asterun.exe'))) {
            $csv = @(Get-ChildItem "$env:HOST\logs\ci-run" -Filter $pair[0])[0].FullName
            $out += "== $($pair[0]) / $($pair[1])"
            $out += @(python .github/kit-validation/who_imports.py $csv $pair[1] 'ncrypt.dll,ntasn1.dll,rstrtmgr.dll,bcrypt.dll' 2>&1 | ForEach-Object { "$_" })
          }
          & .github/kit-validation/Write-Notice.ps1 -Title 'Import chain of ncrypt.dll / ntasn1.dll' -Lines $out

      - name: 7 Negative check on real captures (wrong scenario must be INVALID)
        if: always()
        shell: pwsh
        run: |
          $csv = @(Get-ChildItem "$env:HOST\logs\ci-run" -Filter 'candidate-main-*.csv')[0].FullName
          $app = @(Get-ChildItem C:\AsterunWork\ci-run\scenarios -Directory -Filter 'candidate-main-*')[0].FullName
          $out = @(); $fail = 0
          foreach ($scenario in 'service-command', 'uninstall-worker', 'update-chain') {
            $r = "$env:HOST\logs\ci-run\negative-$scenario.txt"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:HOST\kit\scripts\Analyze-Procmon.ps1" -Csv $csv -Scenario $scenario `
              -AppDir $app -PlantedPath "$app\version.dll" -FunctionalResult PASS -Out $r | Out-Null
            $code = $LASTEXITCODE
            if ($code -ne 30) { $fail++ }
            $out += "candidate-main capture analysed as $scenario -> exit $code (expected 30 INVALID): $((Get-Content $r -ErrorAction SilentlyContinue | Select-Object -Last 1))"
          }
          & .github/kit-validation/Write-Notice.ps1 -Title 'Negative checks on real captures' -Lines $out
          exit $fail

      - name: 7e Observation role and per-DLL Load Image paths on real captures
        if: always()
        shell: pwsh
        run: |
          # U-4c/U-4e use -Role observation -ReportDll on a real capture. Here the
          # same call runs on real runner captures: the forced-RM worker of the
          # fixed build (rstrtmgr/ncrypt must be SYSTEM32), the normal worker
          # (reported as observed, whatever it is), and the v1.0.5 worker with a
          # planted ncrypt.dll (must be WATCHED -> FAIL).
          $logs = "$env:HOST\logs\ci-run"
          $out = @(); $bad = 0
          foreach ($c in @(
              @{ Filter = 'candidate-uninstall-worker-rm-ncrypt-*.csv'; Expect = 12; Require = 'rstrtmgr.dll'; Must = @('name=rstrtmgr.dll class=SYSTEM32 path=C:\Windows\', 'name=ncrypt.dll class=SYSTEM32 path=C:\Windows\') },
              @{ Filter = 'candidate-uninstall-worker-2*.csv';          Expect = 12; Require = '';             Must = @('name=rstrtmgr.dll class=', 'name=ncrypt.dll class=') },
              @{ Filter = 'control-uninstall-worker-ncrypt-*.csv';      Expect = 20; Require = '';             Must = @('name=ncrypt.dll class=WATCHED path=') })) {
            $csv = @(Get-ChildItem $logs -Filter $c.Filter | Sort-Object Name)[0].FullName
            $base = [IO.Path]::GetFileNameWithoutExtension($csv)
            $r = "$logs\observation-$base.txt"
            $argv = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:HOST\kit\scripts\Analyze-Procmon.ps1", '-Csv', $csv,
                      '-Scenario', 'uninstall-worker', '-Role', 'observation', '-AppDir', "C:\AsterunWork\ci-run\scenarios\$base\app",
                      '-ReportDll', 'rstrtmgr.dll,ncrypt.dll', '-Out', $r)
            if ($c.Require) { $argv += @('-RequireSystemLoad', $c.Require) }
            powershell.exe @argv | Out-Null
            $code = $LASTEXITCODE
            $report = @(Get-Content $r -ErrorAction SilentlyContinue)
            $missing = @($c.Must | Where-Object { $m = $_; -not ($report | Where-Object { $_.Contains($m) }) })
            $ok = ($code -eq $c.Expect) -and $missing.Count -eq 0
            if (-not $ok) { $bad++ }
            $out += ('{0} {1}: exit {2} (expected {3}){4}' -f $(if ($ok) { 'ok  ' } else { 'DIFF' }), $base, $code, $c.Expect, $(if ($missing) { ' missing: ' + ($missing -join ' | ') } else { '' }))
            $out += @($report | Where-Object { $_ -match '^(DLL-LOAD|TARGET-IMAGE-DIR|RESULT|  observation)' } | ForEach-Object { "  $_" })
          }
          & .github/kit-validation/Write-Notice.ps1 -Title "Observation role on real captures ($bad differences)" -Lines $out
          exit $bad

      - name: 7b Product F-1 regression must fail on v1.0.5 and pass on the fixed build
        if: always()
        shell: pwsh
        run: |
          # The product CTest (tests/UninstallDllPlantTests.ps1, the formal
          # regression merged with the fix) is run here against BOTH builds to
          # prove it actually catches the bug: it must exit 1 (FAIL) on the
          # vulnerable v1.0.5 worker (planted ncrypt.dll loads from the app
          # directory) and exit 0 (PASS) on the fixed candidate (planted
          # ncrypt.dll stays in System32; rstrtmgr.dll loads from System32).
          $test = 'tests\UninstallDllPlantTests.ps1'
          $ps = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $cases = @(
            @{ Label = 'v1.0.5 baseline worker (expect FAIL=1)'; AppDir = 'C:\AsterunWork\ci-run\baseline';  Expect = 1 },
            @{ Label = 'fixed candidate worker (expect PASS=0)'; AppDir = 'C:\AsterunWork\ci-run\candidate'; Expect = 0 }
          )
          $out = @(); $bad = 0
          foreach ($c in $cases) {
            $log = "$env:HOST\logs\ci-run\product-regression-$($c.Expect).txt"
            & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test `
              -AppDir $c.AppDir -Mode Worker -PlantName ncrypt.dll -ForceRestartManager *> $log
            $code = $LASTEXITCODE
            $ok = $code -eq $c.Expect
            if (-not $ok) { $bad++ }
            $tail = (Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 8) -join "`n"
            $out += ('{0} {1}: exit {2} (expected {3})' -f $(if ($ok) { 'ok  ' } else { 'DIFF' }), $c.Label, $code, $c.Expect)
            $out += $tail
          }
          & .github/kit-validation/Write-Notice.ps1 -Title "Product F-1 regression before/after ($bad differences)" -Lines $out
          exit $bad

      - name: 7d Launcher interactive-state rule and its no-window counterexample (full output)
        if: always()
        shell: pwsh
        run: |
          $ps = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $out = @(); $bad = 0
          foreach ($c in @(
              @{ Label = 'launcher case on the fixed candidate (must pass: window observed, plant not loaded)'; Args = @('-Mode', 'Launcher', '-PlantName', 'ncrypt.dll'); Expect = 0 },
              @{ Label = 'no-window control (must pass: no window, alive, UI modules loaded, rule rejects it)'; Args = @('-Mode', 'NoWindowControl'); Expect = 0 })) {
            $log = Join-Path $env:TEMP ("launcher-rule-" + [guid]::NewGuid().ToString('N') + '.txt')
            & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\UninstallDllPlantTests.ps1 -AppDir C:\AsterunWork\ci-run\candidate @($c.Args) *> $log
            $code = $LASTEXITCODE
            if ($code -ne $c.Expect) { $bad++ }
            $out += ('{0} {1}: exit {2}' -f $(if ($code -eq $c.Expect) { 'ok  ' } else { 'DIFF' }), $c.Label, $code)
            $out += @(Get-Content $log | Where-Object { $_ -match 'ok   |FAIL |control|reachedWindow|regression' } | ForEach-Object { if ($_.Length -gt 240) { $_.Substring(0, 240) + '...' } else { $_ } })
          }
          & .github/kit-validation/Write-Notice.ps1 -Title "Launcher interactive-state rule ($bad differences)" -Lines $out
          exit $bad

      - name: 7c U-4 helpers - worker-directory evidence and VERSION lock
        if: always()
        shell: pwsh
        run: |
          $ps = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $kit = "$env:HOST\kit\scripts"
          $work = Join-Path $env:TEMP ("kit-u4-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          $dir = Join-Path $env:TEMP ("Asterun-Elevated.ci-evidence-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir | Out-Null
          $gone = Join-Path $env:TEMP ("Asterun-Elevated.ci-gone-" + [guid]::NewGuid().ToString('N'))
          Set-Content "$work\one.txt" "TARGET-IMAGE-DIR pid=101 dir=$dir"
          Set-Content "$work\gone.txt" "TARGET-IMAGE-DIR pid=102 dir=$gone"
          Set-Content "$work\none.txt" "RESULT: INVALID"
          Set-Content "$work\two.txt" @("TARGET-IMAGE-DIR pid=103 dir=$dir", "TARGET-IMAGE-DIR pid=104 dir=$gone")
          $cases = @(
            @{ Label = 'ACL record of the confirmed directory'; Args = @('-Report', "$work\one.txt"); Expect = 0; Must = @('Owner=', 'Sddl=', 'icacls:', 'RESULT: RECORDED') },
            @{ Label = 'write test from an ELEVATED runner is flagged not valid'; Args = @('-Report', "$work\one.txt", '-WriteTest'); Expect = 13; Must = @('write test: SUCCEEDED', 'NOT VALID', 'write test file removed') },
            @{ Label = 'confirmed directory gone: no other directory tested'; Args = @('-Report', "$work\gone.txt"); Expect = 32; Must = @('DIRECTORY-GONE') },
            @{ Label = 'no confirmed worker in the report'; Args = @('-Report', "$work\none.txt"); Expect = 30; Must = @('NO-TARGET') },
            @{ Label = 'two workers without -WorkerPid'; Args = @('-Report', "$work\two.txt"); Expect = 31; Must = @('AMBIGUOUS') },
            @{ Label = 'two workers, -WorkerPid selects the existing one'; Args = @('-Report', "$work\two.txt", '-WorkerPid', '103'); Expect = 0; Must = @('RESULT: RECORDED') }
          )
          $out = @(); $bad = 0; $i = 0
          foreach ($c in $cases) {
            $i++; $o = "$work\evidence-$i.txt"
            & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$kit\Get-WorkerDirEvidence.ps1" @($c.Args) -Out $o *> "$o.console"
            $code = $LASTEXITCODE
            $text = if (Test-Path $o) { Get-Content -Raw $o } else { '' }
            $miss = @($c.Must | Where-Object { -not $text.Contains($_) })
            $ok = ($code -eq $c.Expect) -and ($miss.Count -eq 0)
            if (-not $ok) { $bad++ }
            $out += ('{0} {1}: exit {2} (expected {3}){4}' -f $(if ($ok) { 'ok  ' } else { 'DIFF' }), $c.Label, $code, $c.Expect, $(if ($miss) { ' missing: ' + ($miss -join ' | ') } else { '' }))
          }
          $leftover = @(Get-ChildItem $dir -Filter 'u4-writetest-*' -ErrorAction SilentlyContinue)
          if ($leftover.Count) { $bad++; $out += "DIFF write-test file left behind: $($leftover.Name -join ', ')" } else { $out += 'ok   write-test file cleaned up' }
          # Hold-FileLock: GetFileAttributes still works, delete is blocked, delete works after release.
          $install = Join-Path $work 'install'; New-Item -ItemType Directory -Path $install | Out-Null
          $version = Join-Path $install 'VERSION'; Set-Content $version '1.0.0'
          $holder = Start-Process -FilePath $ps -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$kit\Hold-FileLock.ps1", '-Path', $version, '-HoldSeconds', '10' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $attrOk = $true; try { [void][System.IO.File]::GetAttributes($version) } catch { $attrOk = $false }
          $deleteBlocked = $false; try { [System.IO.File]::Delete($version) } catch { $deleteBlocked = $true }
          $holder.WaitForExit(20000) | Out-Null
          $deleteAfter = $true; try { [System.IO.File]::Delete($version) } catch { $deleteAfter = $false }
          foreach ($r in @(@('attributes readable while locked (launcher/validation unaffected)', $attrOk), @('delete blocked while locked (forces Restart Manager)', $deleteBlocked), @('delete succeeds after release', $deleteAfter))) {
            if (-not $r[1]) { $bad++ }
            $out += ('{0} Hold-FileLock: {1}' -f $(if ($r[1]) { 'ok  ' } else { 'DIFF' }), $r[0])
          }
          Remove-Item -LiteralPath $dir, $work -Recurse -Force -ErrorAction SilentlyContinue
          & .github/kit-validation/Write-Notice.ps1 -Title "U-4 helpers on Windows ($bad differences)" -Lines $out
          exit $bad

      - name: 8 Result
        if: always()
        shell: pwsh
        run: |
          # The kit is validated when every step gives the result documented for
          # the current candidate (expected-ci.txt), including the REVIEW/FAIL
          # rows caused by finding F-1.
          $expected = Get-Content .github/kit-validation/expected-ci.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          $summary = Get-Content "$env:HOST\logs\ci-run\summary.txt"
          $out = @(); $bad = 0
          foreach ($line in $expected) {
            $name, $want = $line -split ' ', 2
            $row = @($summary | Where-Object { $_ -match ('^' + [regex]::Escape($name) + '\s') })
            $got = if ($row.Count -eq 1) { ($row[0].Substring($name.Length).Trim() -split '\s{2,}')[0] } else { '<missing>' }
            $ok = $got -eq $want
            if (-not $ok) { $bad++ }
            $out += ('{0} {1}: expected {2}, got {3}' -f $(if ($ok) { 'ok  ' } else { 'DIFF' }), $name, $want, $got)
          }
          & .github/kit-validation/Write-Notice.ps1 -Title "Kit result vs documented expectation ($bad differences)" -Lines $out
          exit $bad

      - name: Upload logs (reports and captures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-validation-logs
          path: |
            C:\AsterunAcceptance\logs
            !C:\AsterunAcceptance\logs\**\*.pml
            !C:\AsterunAcceptance\logs\**\*.csv
          retention-days: 14
